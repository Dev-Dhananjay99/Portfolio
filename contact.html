<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="left-section">
            <p class="Welcome">WEL<span>COME</span></p>
        </div>
        <div class="middle-section">
            <a href="Portfolio.html">Home</a>
            <a href="services.html" target="_blank">Services</a>
            <a href="Experience.html" target="_blank">Experience</a>
            <a href="Projects.html" target="_blank">Projects</a>
            <a href="Education.html" target="_blank">Education</a>
        </div>
        <div class="right-section">
            <button class="contact-button">Contact Me</button>
        </div>
    </div>

    <div class="contact-container">
        <div class="contact-header">
            <h2>Get In <span>Touch</span></h2>
            <p>I'm currently looking for new opportunities. Feel free to drop a message!</p>
        </div>
        
        <form class="contact-form">
            <div class="input-group">
                <input type="text" placeholder="Your Name" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Your Email" required>
            </div>
            <div class="input-group">
                <input type="text" placeholder="Subject">
            </div>
            <div class="input-group">
                <textarea placeholder="Your Message" rows="5" required></textarea>
            </div>
            <button type="submit" class="send-button">Send Message</button>
        </form>
    </div>
</body>
</html>
